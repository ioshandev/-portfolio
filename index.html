:root{--bg:#030814;--bg2:#071433;--ink:#eaf2ff;--mute:#93a8d4;--line:#16295a;--b1:#2563eb;--b2:#3b82f6;--b3:#60a5fa;--b4:#bfdbfe;--cy:#22d3ee;--glow:rgba(59,130,246,.5);

color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:80px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--b);line-height:1.7;overflow-x:hidden}
.aur{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aur i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:fl 18s ease-in-out infinite alternate}
.aur i:nth-child(1){width:520px;height:520px;background:#1d4ed8;left:-140px;top:-100px}
.aur i:nth-child(2){width:420px;height:420px;background:#0ea5e9;right:-120px;top:38%;opacity:.3;animation-delay:-6s}
.aur i:nth-child(3){width:480px;height:480px;background:#312e81;left:20%;bottom:-200px;opacity:.5;animation-delay:-11s}
@keyframes fl{to{transform:translate(60px,80px) scale(1.15)}}
